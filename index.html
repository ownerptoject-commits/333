<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a52">
<title> привет машука👋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #2a1a52;
    --dusk: #5b3a9e;
    --lilac: #c9b8ff;
    --peach: #ffb38f;
    --pink: #ff7aa5;
    --white: #fffaf7;
    --head: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--body);
    color: var(--white);
    background: linear-gradient(170deg, var(--night) 0%, var(--dusk) 55%, #c26a9a 100%);
    background-attachment: fixed;
    overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* закат на фоне */
  .sun {
    position: fixed; left: 50%; bottom: -22vmin; width: 70vmin; height: 70vmin;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #ffd1a8 0%, var(--peach) 35%, rgba(255,122,165,.0) 70%);
    opacity: .75; filter: blur(2px); pointer-events: none;
    animation: rise 2.4s ease-out both;
  }
  @keyframes rise { from { transform: translate(-50%, 40%); opacity: 0; } to { transform: translate(-50%, 0); opacity: .75; } }

  .screen {
    position: fixed; inset: 0;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 28px;
    opacity: 0; visibility: hidden; transform: translateY(14px);
    transition: opacity .45s ease, transform .45s ease, visibility 0s .45s;
  }
  .screen.active { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

  h1 {
    font-family: var(--head); font-weight: 700;
    font-size: clamp(30px, 9vw, 46px); line-height: 1.15; margin: 0; letter-spacing: -.02em;
    max-width: 14ch;
  }
  p.sub { margin: 0; font-size: 18px; line-height: 1.5; color: var(--lilac); max-width: 28ch; }

  .row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

  button {
    font-family: var(--body); font-weight: 700; font-size: 18px; cursor: pointer;
    border: 0; border-radius: 999px; padding: 16px 36px; min-width: 120px;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease, font-size .2s ease;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  .yes {
    background: linear-gradient(135deg, var(--peach), var(--pink)); color: #3a1346;
    box-shadow: 0 10px 30px rgba(255,122,165,.45);
  }
  .yes:active { transform: scale(.96); }
  .no {
    background: rgba(255,255,255,.14); color: var(--white);
    border: 1.5px solid rgba(255,255,255,.35); backdrop-filter: blur(6px);
    white-space: nowrap; z-index: 20;
  }
  .no.free {
    position: fixed; margin: 0;
    transition: left .28s cubic-bezier(.3,1.5,.5,1), top .28s cubic-bezier(.3,1.5,.5,1), background .2s;
  }

  /* время */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 360px); }
  .chip {
    padding: 14px 0; min-width: 0; font-size: 17px;
    background: rgba(255,255,255,.12); color: var(--white);
    border: 1.5px solid rgba(255,255,255,.28);
  }
  .chip[aria-pressed="true"] {
    background: var(--white); color: var(--night); border-color: var(--white);
    transform: scale(1.05); box-shadow: 0 8px 22px rgba(0,0,0,.25);
  }
  button:disabled { opacity: .4; cursor: default; box-shadow: none; }

  .big-emoji { font-size: 64px; line-height: 1; }
  .summary {
    background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.25);
    border-radius: 22px; padding: 16px 22px; font-size: 18px; line-height: 1.6;
  }
  .fallback { display: none; }
  .note { font-size: 14px; color: var(--lilac); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .sun, .screen, button, .no.free { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="sun" aria-hidden="true"></div>

<!-- 1. приглашение -->
<section class="screen active" id="s1">
  <h1>привет машука 👋</h1>
  <p class="sub">гоу погуляем в воскресенье?</p>
  <div class="row" id="btns">
    <button class="yes" id="yes">Да</button>
    <button class="no" id="no">Нет</button>
  </div>
</section>

<!-- 2. время -->
<section class="screen" id="s2">
  <h1>заебись! во сколько сможешь выйти?</h1>
  <div class="chips" id="chips"></div>
  <button class="yes" id="next2" disabled>Дальше</button>
</section>

<!-- 3. редбулл -->
<section class="screen" id="s3">
  <p class="sub">И напоследок…</p>
  <h1>редбулл будешь? 🥤</h1>
  <button class="yes" id="rb">Да</button>
</section>

<!-- 4. финал -->
<section class="screen" id="s4">
  <div class="big-emoji">🎉</div>
  <h1>заебись!</h1>
  <div class="summary" id="summary"></div>
  <a class="fallback" id="fallback"><button class="yes" type="button">Отправить ответ</button></a>
  <p class="note" id="note"></p>
</section>

<script>
/* ============ НАСТРОЙКИ ============ */
const CONFIG = {
  // Чтобы ты видел ответы Маши сам, создай бота у @BotFather в Telegram,
  // впиши токен и свой chat_id (его покажет @userinfobot). Напиши своему боту /start.
  TELEGRAM_BOT_TOKEN: "",
  TELEGRAM_CHAT_ID: "",
  // Запасной вариант без бота: на последнем экране появится кнопка,
  // которая откроет чат с тобой в Telegram с готовым сообщением. Впиши свой ник без @.
  MY_TELEGRAM_USERNAME: "@the_social_anxiety",
  TIMES: ["19:00","19:30","20:00","20:30","21:00","21:30","22:00","22:30","23:00"]
};
/* ===================================== */

const $ = id => document.getElementById(id);
const state = { attempts: 0, time: null, redbull: false };

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

async function notify(text) {
  const { TELEGRAM_BOT_TOKEN: t, TELEGRAM_CHAT_ID: c } = CONFIG;
  if (!t || !c) return false;
  try {
    await fetch(`https://api.telegram.org/bot${t}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: c, text })
    });
    return true;
  } catch (e) { return false; }
}

/* ---- убегающая кнопка «Нет» ---- */
const noBtn = $("no"), yesBtn = $("yes");
const phrases = ["Нет", "Ты уверена?", "Подумай ещё", "Ну пожалуйста", "Не получится 😌", "Лови меня", "Не-а"];
let notified = false;

function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  state.attempts++;

  const first = !noBtn.classList.contains("free");
  if (first) {
    const r = noBtn.getBoundingClientRect();
    noBtn.style.width = r.width + "px";
    noBtn.style.left = r.left + "px";
    noBtn.style.top = r.top + "px";
    noBtn.classList.add("free");
    document.body.appendChild(noBtn);
    void noBtn.offsetWidth;
  }

  noBtn.textContent = phrases[state.attempts % phrases.length];
  noBtn.style.width = "auto";

  // «Да» растёт с каждой попыткой
  yesBtn.style.fontSize = Math.min(18 + state.attempts * 1.4, 28) + "px";

  const pt = e && (e.touches ? e.touches[0] : e);
  const px = pt && pt.clientX != null ? pt.clientX : -999;
  const py = pt && pt.clientY != null ? pt.clientY : -999;

  const pad = 14;
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
  const maxX = window.innerWidth - bw - pad;
  const maxY = window.innerHeight - bh - pad;
  const yr = yesBtn.getBoundingClientRect();
  const yes = { l: yr.left - 20, r: yr.right + 20, t: yr.top - 20, b: yr.bottom + 20 };

  let x = pad, y = pad;
  for (let i = 0; i < 60; i++) {
    x = pad + Math.random() * Math.max(maxX - pad, 0);
    y = pad + Math.random() * Math.max(maxY - pad, 0);
    const cx = x + bw / 2, cy = y + bh / 2;
    const farFromFinger = Math.hypot(cx - px, cy - py) > 150;
    const overlapsYes = x < yes.r && x + bw > yes.l && y < yes.b && y + bh > yes.t;
    if (farFromFinger && !overlapsYes) break;
  }
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  if (!notified && state.attempts >= 1) { notified = true; notify("Маша открыла сайт и пытается нажать «нет» 😄"); }
}

["pointerenter", "pointerdown", "touchstart", "mousedown", "focus"].forEach(ev =>
  noBtn.addEventListener(ev, dodge, { passive: false })
);
noBtn.addEventListener("click", e => { e.preventDefault(); dodge(e); });

/* ---- шаг 1 → 2 ---- */
yesBtn.addEventListener("click", () => {
  noBtn.style.display = "none";
  notify(`Маша сказала ДА на прогулку в воскресенье ✅\nКнопку «нет» пыталась нажать: ${state.attempts} раз`);
  show("s2");
});

/* ---- время ---- */
const chips = $("chips");
CONFIG.TIMES.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = t;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => {
    state.time = t;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    $("next2").disabled = false;
  });
  chips.appendChild(b);
});
$("next2").addEventListener("click", () => {
  notify(`Маша выбрала время: ${state.time} 🕗`);
  show("s3");
});

/* ---- редбулл ---- */
$("rb").addEventListener("click", async () => {
  state.redbull = true;
  const report =
    `Маша ответила ✅\n` +
    `Прогулка в воскресенье: да\n` +
    `Время: ${state.time}\n` +
    `Редбулл: да 🥤\n` +
    `(«нет» пыталась нажать ${state.attempts} раз)`;

  $("summary").innerHTML = `Воскресенье, ${state.time}<br>Редбулл уже в планах 🥤`;
  show("s4");

  const sent = await notify(report);
  if (!sent && CONFIG.MY_TELEGRAM_USERNAME) {
    const a = $("fallback");
    a.href = `https://t.me/${CONFIG.MY_TELEGRAM_USERNAME}?text=${encodeURIComponent(report)}`;
    a.target = "_blank"; a.rel = "noopener";
    a.style.display = "block";
    $("note").textContent = "Нажми, чтобы отправить мне ответ";
  }
});
</script>
</body>
</html>
